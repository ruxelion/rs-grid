[package]
name = "rs-grid-core"
# Explicit (not workspace-inherited): per-crate independent versioning, bumped by
# release-plz. See release-plz.toml.
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
authors.workspace = true
publish.workspace = true
description = "Headless grid engine core: model, viewport, selection, hit-testing"
keywords = ["grid", "data-grid", "virtual-scroll", "headless", "spreadsheet"]
categories = ["data-structures", "algorithms"]

[lints]
workspace = true

# Disable the default libtest bench harness for the lib target. Without this,
# `cargo bench -- --sample-size N` also runs the lib's libtest harness, which
# rejects Criterion's args ("Unrecognized option: 'sample-size'") and aborts the
# whole `cargo bench` run. Only the `harness = false` Criterion benches below
# should run.
[lib]
bench = false

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "hit_test"
harness = false

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "init"
harness = false

[dependencies]
