[package]
name = "rs-grid-yew"
# Explicit (not workspace-inherited): per-crate independent versioning, bumped by
# release-plz. See release-plz.toml.
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
authors.workspace = true
publish.workspace = true
description = "Yew CSR component wrapper for rs-grid"
keywords = ["grid", "yew", "component", "wasm", "data-grid"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
rs-grid-core  = { path = "../rs-grid-core", version = "0.2.1" }
rs-grid-scene = { path = "../rs-grid-scene", version = "0.1.6" }
rs-grid-web   = { path = "../rs-grid-web", version = "0.1.7" }
yew           = { version = "0.23", features = ["csr"] }
wasm-bindgen  = { workspace = true }
web-sys       = { workspace = true }
