[package]
name = "rs-grid-dioxus"
# Explicit (not workspace-inherited): per-crate independent versioning, bumped by
# release-plz. See release-plz.toml.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
authors.workspace = true
publish.workspace = true
description = "Dioxus CSR component wrapper for rs-grid"
keywords = ["grid", "dioxus", "component", "wasm", "data-grid"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
rs-grid-core  = { path = "../rs-grid-core", version = "0.2.0" }
rs-grid-scene = { path = "../rs-grid-scene", version = "0.1.5" }
rs-grid-web   = { path = "../rs-grid-web", version = "0.1.6" }
dioxus        = { version = "0.7", features = ["web"] }
wasm-bindgen  = { workspace = true }
web-sys       = { workspace = true }
