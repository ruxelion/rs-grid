[package]
name = "rs-grid-web"
# Explicit (not workspace-inherited): per-crate independent versioning, bumped by
# release-plz. See release-plz.toml.
version = "0.1.10"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
authors.workspace = true
publish.workspace = true
description = "Browser event handling, canvas sizing, and rAF loop for rs-grid"
keywords = ["grid", "wasm", "canvas", "browser", "event-handling"]
categories = ["web-programming", "wasm"]

[dependencies]
rs-grid-core = { path = "../rs-grid-core", version = "0.2.4" }
rs-grid-scene = { path = "../rs-grid-scene", version = "0.2.2" }
rs-grid-render-canvas = { path = "../rs-grid-render-canvas", version = "0.1.9" }
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
