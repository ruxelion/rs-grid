[package]
name = "rs-grid-leptos"
# Explicit (not workspace-inherited): per-crate independent versioning, bumped by
# release-plz. See release-plz.toml.
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
authors.workspace = true
publish.workspace = true
description = "Leptos component wrapper for rs-grid"
keywords = ["grid", "leptos", "component", "wasm", "data-grid"]
categories = ["gui", "web-programming", "wasm"]

[dependencies]
rs-grid-core  = { path = "../rs-grid-core", version = "0.1.1" }
rs-grid-scene = { path = "../rs-grid-scene", version = "0.1.1" }
rs-grid-web   = { path = "../rs-grid-web", version = "0.1.1" }
# No leptos feature is enabled here so that consumers can pick the
# rendering mode (`csr` or `hydrate`) that fits their app. Enabling
# `csr` unconditionally would conflict with `hydrate` in SSR/hydrate
# Leptos apps via Cargo's feature unification.
leptos = { version = "0.8", default-features = false }
send_wrapper = "0.6"
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }

[features]
default = []
# Re-export Leptos rendering modes so callers that depend on
# rs-grid-leptos directly (without depending on `leptos`) can pick
# one. Apps that already depend on `leptos` should enable the
# matching feature on `leptos` itself instead.
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
