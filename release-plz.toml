# release-plz — automates version bumps + changelog for rs-grid.
#
# release-plz opens a PR with per-crate bumps + CHANGELOG.md derived from
# conventional commits (the release-plz-pr job). Once that PR is merged, the
# release-plz-release job publishes the bumped crates to crates.io and creates
# tags + GitHub Releases (gated by the AUTO_PUBLISH repo variable; see
# .github/workflows/release-plz.yml). `just publish` stays as a local fallback.
#
# Independent per-crate versioning (release-plz default): each crate has its own
# version. One tag per crate, all pointing at the same release commit.
# Docs: https://release-plz.dev/docs/config

[workspace]
git_tag_name = "{{ package }}-v{{ version }}"
# Create a GitHub Release per crate on publish (explicit; this is the default).
git_release_enable = true

# Internal crates (publish = false in their Cargo.toml): excluded from releases —
# no bump, no changelog, never published.
[[package]]
name = "example-common"
release = false

[[package]]
name = "fixture-leptos"
release = false
