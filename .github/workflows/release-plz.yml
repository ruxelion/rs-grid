name: Release-plz

# Opens/updates a release PR (version bump + per-crate CHANGELOG.md derived
# from conventional commits). Release-PR-only mode: crates.io publishing stays
# manual via /publish — no `release` job, so no CARGO_REGISTRY_TOKEN needed.
#
# Config: release-plz.toml (independent per-crate versioning,
# tags: rs-grid-<crate>-v<x.y.z>).

on:
  push:
    branches: [main]

# Prevent concurrent runs on rapid successive pushes.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Optional PAT: lets the release PR trigger ci.yml. With the default
          # GITHUB_TOKEN the PR is created but its CI does not run.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
