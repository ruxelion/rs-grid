name: Release-plz

# Ouvre/met à jour une PR de release (bump de version + CHANGELOG.md par crate,
# dérivés des commits conventionnels). Mode release-PR-only : la publication
# crates.io reste manuelle via /publish — pas de job `release`, donc pas de
# CARGO_REGISTRY_TOKEN nécessaire ici.
#
# Config : release-plz.toml (versioning indépendant, tags rs-grid-<crate>-v<x.y.z>).

on:
  push:
    branches: [main]

# Évite de lancer plusieurs runs concurrents sur des push rapprochés.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT optionnel : permet à la PR de release de déclencher ci.yml. Avec le
          # GITHUB_TOKEN par défaut la PR est créée mais sa CI ne tourne pas.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
