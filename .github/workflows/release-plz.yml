name: Release-plz

# Two jobs, both on push to main:
#   - release-plz-pr:      opens/updates the release PR (version bump +
#                          per-crate CHANGELOG.md from conventional commits).
#   - release-plz-release: once a release PR is merged, publishes the bumped
#                          crates to crates.io + creates tags + GitHub Releases.
#                          Token-less via OIDC Trusted Publishing (no
#                          CARGO_REGISTRY_TOKEN). Idempotent: does nothing until
#                          a new version lands on main.
#
# The release job is gated by the repo variable AUTO_PUBLISH: it is a no-op
# until you set `AUTO_PUBLISH=true` (after configuring Trusted Publishing on
# crates.io for all 8 crates). `just publish` remains the local fallback.
#
# Config: release-plz.toml (independent per-crate versioning,
# tags: rs-grid-<crate>-v<x.y.z>).

on:
  push:
    branches: [main]

# Prevent concurrent runs on rapid successive pushes.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Optional PAT: lets the release PR trigger ci.yml. With the default
          # GITHUB_TOKEN the PR is created but its CI does not run.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

  release-plz-release:
    name: Release-plz publish
    # Off until Trusted Publishing is configured on crates.io and you flip the
    # repo variable: `gh variable set AUTO_PUBLISH --body true`.
    if: ${{ vars.AUTO_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags + create GitHub Releases
      id-token: write # OIDC → crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT (not github.token) so the tags release-plz pushes re-trigger
          # release.yml → site rebuild. github.token-pushed tags trigger nothing.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Exchange the GitHub OIDC token for a short-lived crates.io token. Works
      # for every crate that lists this repo+workflow as a Trusted Publisher.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
